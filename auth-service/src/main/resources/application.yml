server:
  port: 8081

spring:
  application:
    name: auth-service

services:
  users:
    url: ${USERS_SERVICE_URL:http://localhost:8082}

jwt:
  secret: ${JWT_SECRET:my-very-secure-jwt-secret-key-that-is-at-least-256-bits-long}
  expiration: 3600000 # 1 hour in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mercadonosso.auth_service: DEBUG
    org.springframework.security: DEBUG
