server:
  port: 0

spring:
  application:
    name: orders-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}